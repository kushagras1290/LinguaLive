[pytest]
testpaths = tests
pythonpath = .
# Integration tests load multi-gigabyte weights and take minutes, so they are
# opt-in: run them with `pytest -m integration`.
addopts = -ra --strict-markers -m "not integration"
markers =
    integration: exercises real model weights; slow and requires downloaded models
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
